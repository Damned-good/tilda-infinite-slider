<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tilda Infinite Slider — пример структуры</title>
    <style>
        body {
            margin: 40px;
            font-family: Arial, sans-serif;
        }

        .uc-slider1 {
            position: relative;
            max-width: 760px;
            margin: 0 auto;
        }

        .container {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
        }

        .tn-molecule {
            position: absolute;
            left: 0;
            top: 0;
            width: 1000px;
            height: 220px;
        }

        .slide {
            position: absolute;
            top: 0;
            height: 180px;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #b8b8b8;
            border-radius: 16px;
            background: #f2f2f2;
        }

        .slide-1 {
            left: 0;
            width: 240px;
        }

        .slide-2 {
            left: 280px;
            width: 320px;
        }

        .slide-3 {
            left: 640px;
            width: 220px;
        }

        .slider-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <!--
        В опубликованной Tilda эту структуру создаёт Zero Block.
        Здесь показаны только классы, которые ожидает slider.js.
    -->
    <div class="uc-slider1">
        <div class="t396__group container tn-group">
            <div class="tn-molecule">
                <div class="t396__group slide slide-1">Карточка 1 — 240 px</div>
                <div class="t396__group slide slide-2">Карточка 2 — 320 px</div>
                <div class="t396__group slide slide-3">Карточка 3 — 220 px</div>
            </div>
        </div>

        <div class="slider-controls">
            <a class="slider-prev" href="#prev">Назад</a>
            <a class="slider-next" href="#next">Вперёд</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/Damned-good/tilda-infinite-slider@v0.9.0/slider.js"></script>
</body>
</html>
